# Reverse proxy for the single Node service. Copy to /etc/nginx/sites-available/pyp-academic-hub,
# enable it, then run `sudo certbot --nginx -d portal.e-p-s.in` for HTTPS.
server {
    listen 80;
    server_name portal.e-p-s.in;

    client_max_body_size 5m; # question images are sent as base64 JSON (API limit 4 MB)

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
